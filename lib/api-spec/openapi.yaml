openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Sewspace digital sewing studio API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: studio
    description: Sewing studio data
  - name: ai
    description: AI-ready sewing tools
  - name: storage
    description: File upload helpers
  - name: public
    description: Read-only endpoints that work without signing in
  - name: feed
    description: Posts and feeds
  - name: social
    description: Likes, comments, saves, follows, blocks and reports
  - name: admin
    description: Report review (ADMIN_USER_IDS only)
  - name: catalog
    description: Shared pattern and product pages, and reviews
  - name: challenges
    description: Hashtag challenges with entries
paths:
  /public/profiles/{handle}:
    get:
      operationId: getPublicProfile
      tags: [public]
      summary: Public profile by handle. Works signed out; returns public fields only.
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Public profile fields only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicProfile" }
        "404": { description: Profile not found }
  /public/profiles/{handle}/posts:
    get:
      operationId: getProfilePosts
      tags: [public]
      summary: A person's posts that the viewer may see, newest first. Works signed out.
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: A page of posts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedPage" }
        "404": { description: Profile not found (or blocked either way) }
  /public/profiles/{handle}/makes:
    get:
      operationId: getProfileMakes
      tags: [public]
      summary: A person's makes that the viewer may see, finished first. Works signed out.
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Finished makes and shared makes in progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileMakes" }
        "404": { description: Profile not found (or blocked either way) }
  /public/profiles/{handle}/used:
    get:
      operationId: getProfileUsed
      tags: [public]
      summary: Patterns, fabrics and threads used in the person's makes, each with the makes it was used in. Only items and makes the viewer may see.
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Used products
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileUsed" }
        "404": { description: Profile not found (or blocked either way) }
  /public/makes/{id}:
    get:
      operationId: getPublicMake
      tags: [public]
      summary: A make (project) the viewer is allowed to see. Works signed out for public makes.
      description: Returns 404 when the make doesn't exist or isn't visible to this viewer (private, followers-only for a non-follower, or a block either way). Never includes measurements or pattern PDFs.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The make
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicMake" }
        "404": { description: Not found or not visible }
  /visibility/{kind}/{id}:
    put:
      operationId: setVisibility
      tags: [studio]
      summary: Change who can see one of your makes, fabrics, threads or patterns
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [project, fabric, thread, pattern] }
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VisibilityChange" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisibilityResult" }
        "404": { description: Not one of your items }
  /public/posts/{id}:
    get:
      operationId: getPublicPost
      tags: [public]
      summary: A post the viewer may see. Works signed out for public posts.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedPost" }
        "404": { description: Not found or not visible }
  /public/explore:
    get:
      operationId: getExploreFeed
      tags: [public]
      summary: Recent public posts from everyone (Discover). Works signed out; hides people you've blocked or who blocked you.
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - name: kind
          in: query
          required: false
          schema: { type: string, enum: [all, photo, status, make], default: all }
        - name: sort
          in: query
          required: false
          description: "recent: newest first. popular: most liked in the last 14 days."
          schema: { type: string, enum: [recent, popular], default: recent }
      responses:
        "200":
          description: A page of posts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedPage" }
  /public/posts/{id}/comments:
    get:
      operationId: getPostComments
      tags: [public]
      summary: Comments on a post the viewer may see, oldest first, each with its replies. Hides comments from people on the other side of a block.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Comment" }
        "404": { description: Post not found or not visible }
  /posts/{id}/comments:
    post:
      operationId: createComment
      tags: [social]
      summary: Comment on a post you may see, or reply to a top-level comment on it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommentInput" }
      responses:
        "201":
          description: The new comment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400": { description: "Empty, too long, or not a valid reply" }
        "404": { description: Post not found or not visible }
        "429": { description: Too many comments }
  /comments/{id}:
    delete:
      operationId: deleteComment
      tags: [social]
      summary: Delete your comment, or any comment on your post.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
        "404": { description: Not found or not yours to delete }
  /posts/{id}/like:
    put:
      operationId: likePost
      tags: [social]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Liked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LikeState" }
        "404": { description: Post not found or not visible }
    delete:
      operationId: unlikePost
      tags: [social]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Not liked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LikeState" }
        "404": { description: Post not found or not visible }
  /posts/{id}/save:
    put:
      operationId: savePost
      tags: [social]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveState" }
        "404": { description: Post not found or not visible }
    delete:
      operationId: unsavePost
      tags: [social]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Not saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveState" }
  /saved:
    get:
      operationId: getSavedPosts
      tags: [social]
      summary: Posts you saved that you may still see, most recently saved first.
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: A page of posts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedPage" }
  /follows/{handle}:
    put:
      operationId: followProfile
      tags: [social]
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Following
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FollowState" }
        "400": { description: You can't follow yourself }
        "404": { description: Profile not found (or blocked either way) }
    delete:
      operationId: unfollowProfile
      tags: [social]
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Not following
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FollowState" }
        "404": { description: Profile not found }
  /blocks:
    get:
      operationId: listBlocks
      tags: [social]
      summary: People you have blocked.
      responses:
        "200":
          description: Blocked people
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BlockedPerson" }
  /blocks/{handle}:
    put:
      operationId: blockProfile
      tags: [social]
      summary: Block someone. Ends follows both ways; you stop seeing each other's profiles, posts, makes and comments.
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Blocked }
        "400": { description: You can't block yourself }
        "404": { description: Profile not found }
    delete:
      operationId: unblockProfile
      tags: [social]
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Unblocked (or wasn't blocked) }
  /reports:
    post:
      operationId: createReport
      tags: [social]
      summary: Report a post, comment or profile you can see to the admins.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportInput" }
      responses:
        "201":
          description: Report filed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportReceipt" }
        "404": { description: Nothing to report there (not found or not visible) }
        "429": { description: Too many reports }
  /admin/reports:
    get:
      operationId: listReports
      tags: [admin]
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [open, removed, dismissed], default: open }
      responses:
        "200":
          description: Reports, oldest open first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Report" }
        "403": { description: Not an admin }
  /admin/reports/{id}/resolve:
    post:
      operationId: resolveReport
      tags: [admin]
      summary: "remove: delete the reported post or comment and close every open report on it. dismiss: close this report."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportResolution" }
      responses:
        "200":
          description: The resolved report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "400": { description: Profiles can't be removed; dismiss instead }
        "403": { description: Not an admin }
        "404": { description: Not found }
  /public/catalog:
    get:
      operationId: listCatalog
      tags: [public]
      summary: Browse or search shared pattern and product pages. Works signed out.
      parameters:
        - name: kind
          in: query
          required: false
          schema: { type: string, enum: [pattern, product], default: pattern }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 80 } }
      responses:
        "200":
          description: Up to 60 entries, most reviewed first (or best match when searching)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogList" }
  /public/catalog/{kind}/{slug}:
    get:
      operationId: getCatalogPage
      tags: [public]
      summary: A shared pattern or product page with its numbers, the makes the viewer may see, and the viewer's own review.
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [pattern, product] }
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogPage" }
        "404": { description: Not found }
  /public/catalog/{kind}/{slug}/reviews:
    get:
      operationId: getCatalogReviews
      tags: [public]
      summary: Reviews, most helpful first. Hides reviews from people on the other side of a block.
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [pattern, product] }
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Review" }
        "404": { description: Not found }
  /public/catalog-entries/{id}:
    get:
      operationId: getCatalogEntry
      tags: [public]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogEntry" }
        "404": { description: Not found }
  /catalog:
    post:
      operationId: createCatalogEntry
      tags: [catalog]
      summary: Add a shared page. If one with the same name and maker exists, returns that one (200) instead.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogInput" }
      responses:
        "200":
          description: An entry with this name and maker already existed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogEntry" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogEntry" }
        "400": { description: Invalid }
        "409": { description: Choose a handle first }
        "429": { description: Too many new pages today }
  /catalog/{id}:
    patch:
      operationId: updateCatalogEntry
      tags: [catalog]
      summary: Correct an entry you added (admins can correct any).
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogEntry" }
        "404": { description: Not found or not yours to edit }
  /catalog/{id}/review:
    put:
      operationId: saveReview
      tags: [catalog]
      summary: Write or update your review.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewInput" }
      responses:
        "200":
          description: Your review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        "400": { description: "Invalid, or the make isn't yours" }
        "404": { description: Not found }
        "409": { description: Choose a handle first }
    delete:
      operationId: deleteReview
      tags: [catalog]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted (or there was none) }
  /reviews/{id}/helpful:
    put:
      operationId: markReviewHelpful
      tags: [catalog]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Marked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HelpfulState" }
        "400": { description: Not on your own review }
        "404": { description: Not found }
    delete:
      operationId: unmarkReviewHelpful
      tags: [catalog]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Unmarked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HelpfulState" }
  /catalog/{id}/library:
    post:
      operationId: addCatalogPatternToLibrary
      tags: [catalog]
      summary: Add this pattern to your (private) pattern library, linked to the page. Returns the existing one if already there.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: In your library
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryResult" }
        "400": { description: Only patterns go in the pattern library }
        "404": { description: Not found }
  /catalog-links/{kind}/{id}:
    put:
      operationId: setCatalogLink
      tags: [catalog]
      summary: Link one of your patterns, fabrics or threads to a shared page (or unlink with null).
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [pattern, fabric, thread] }
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogLinkInput" }
      responses:
        "200":
          description: Linked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogLinkResult" }
        "400": { description: Patterns link to pattern pages; fabrics and threads to product pages }
        "404": { description: "Not one of your items, or no such page" }
  /public/challenges:
    get:
      operationId: listChallenges
      tags: [public]
      summary: Challenges by status. Works signed out; hides challenges hosted by people on the other side of a block.
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [active, upcoming, ended], default: active }
      responses:
        "200":
          description: "Active: ending soonest first. Upcoming: starting soonest first. Ended: most recent first."
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChallengeSummary" }
  /public/challenges/{slug}:
    get:
      operationId: getChallengePage
      tags: [public]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The challenge
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChallengePage" }
        "404": { description: Not found }
  /public/challenges/{slug}/entries:
    get:
      operationId: getChallengeEntries
      tags: [public]
      summary: Entries the viewer may see. Removed entries are left out.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: [liked, newest, following], default: liked }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: A page of entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChallengeEntryPage" }
        "404": { description: Not found }
  /challenges:
    post:
      operationId: createChallenge
      tags: [challenges]
      summary: Start a challenge. You host it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChallengeInput" }
      responses:
        "201":
          description: Started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Challenge" }
        "400": { description: Invalid tag or dates }
        "409": { description: "Tag already used, or choose a handle first" }
        "429": { description: Too many challenges }
  /challenges/joined:
    get:
      operationId: listJoinedChallenges
      tags: [challenges]
      summary: Running challenges you've joined (to enter a post).
      responses:
        "200":
          description: Challenges
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChallengeSummary" }
  /challenges/{slug}:
    patch:
      operationId: updateChallenge
      tags: [challenges]
      summary: Reword your challenge. The tag and dates stay as announced.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChallengeUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Challenge" }
        "404": { description: Not found or not yours }
  /challenges/{slug}/membership:
    put:
      operationId: joinChallenge
      tags: [challenges]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipState" }
        "400": { description: The challenge has ended }
        "404": { description: Not found }
    delete:
      operationId: leaveChallenge
      tags: [challenges]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Left
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipState" }
        "404": { description: Not found }
  /challenges/{slug}/entries:
    post:
      operationId: enterChallenge
      tags: [challenges]
      summary: Enter one of your public posts while the challenge runs. Joins you if needed.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EntryInput" }
      responses:
        "201":
          description: Entered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChallengeEntry" }
        "400": { description: "Not running, not a public post of yours, or removed before" }
        "404": { description: Not found }
        "409": { description: Already entered }
  /challenge-entries/{id}:
    delete:
      operationId: deleteChallengeEntry
      tags: [challenges]
      summary: Withdraw your entry, or (as the host) remove someone's entry.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Done }
        "404": { description: Not found or not yours to remove }
  /feed:
    get:
      operationId: getHomeFeed
      tags: [feed]
      summary: Posts from people you follow, and your own, newest first.
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: A page of posts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedPage" }
  /media:
    post:
      operationId: createMedia
      tags: [feed]
      summary: Process an uploaded image into a 1600 px WebP and a 400 px thumbnail, with EXIF/GPS removed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaInput" }
      responses:
        "201":
          description: Processed image, ready to attach to a post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Media" }
        "400":
          description: Not one of your image uploads, or not a readable image
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /posts:
    post:
      operationId: createPost
      tags: [feed]
      summary: Post a status (text only) or 1–10 photos with a caption.
      requestBody:
        required: true
        content:
          application/json:
