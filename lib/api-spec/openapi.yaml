        notes: { type: string, nullable: true }
        measurements:
          $ref: "#/components/schemas/MeasurementValues"
      required: [id, name, recordedAt, notes, measurements]
    MeasurementProfileInput:
      type: object
      required: [name, recordedAt, measurements]
      properties:
        name: { type: string }
        recordedAt: { type: string, format: date }
        notes: { type: string, nullable: true }
        measurements:
          $ref: "#/components/schemas/MeasurementValues"
    MeasurementProfileUpdate:
      allOf:
        - $ref: "#/components/schemas/MeasurementProfileInput"
    MeasurementValues:
      type: object
      properties:
        bust: { type: number }
        neck: { type: number }
        rise: { type: number }
        waist: { type: number }
        wrist: { type: number }
        height: { type: number }
        inseam: { type: number }
        fullHip: { type: number }
        highHip: { type: number }
        upperArm: { type: number }
        armLength: { type: number }
        underbust: { type: number }
        backLength: { type: number }
        frontLength: { type: number }
        shoulderWidth: { type: number }
      additionalProperties: false
    Dashboard:
      type: object
      properties:
        userName: { type: string }
        fabricCount: { type: integer }
        threadCount: { type: integer }
        patternCount: { type: integer }
        projectCount: { type: integer }
        activeProject:
          oneOf:
            - $ref: "#/components/schemas/Project"
            - type: "null"
        recentFabrics:
          type: array
          items: { $ref: "#/components/schemas/Fabric" }
        recentPatterns:
          type: array
          items: { $ref: "#/components/schemas/Pattern" }
      required: [userName, fabricCount, threadCount, patternCount, projectCount, activeProject, recentFabrics, recentPatterns]
    AssistantInput:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1 }
        projectId: { type: integer, nullable: true }
        imageUrl: { type: string, nullable: true }
    AssistantResponse:
      type: object
      properties:
        answer: { type: string }
        mode: { type: string, enum: [demo, live] }
      required: [answer, mode]
    VisualizationInput:
      type: object
      required: [patternId, fabricId]
      properties:
        patternId: { type: integer }
        fabricId: { type: integer }
        bodyType: { type: string, nullable: true }
    Visualization:
      type: object
      properties:
        id: { type: integer }
        imageUrl: { type: string }
        mode: { type: string, enum: [demo, live] }
        disclaimer: { type: string }
      required: [id, imageUrl, mode, disclaimer]
    Recommendation:
      type: object
      properties:
        pattern:
          $ref: "#/components/schemas/Pattern"
        fabric:
          $ref: "#/components/schemas/Fabric"
        suitability: { type: integer }
        reason: { type: string }
      required: [pattern, fabric, suitability, reason]
    UploadRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string }
        size: { type: integer }
        contentType: { type: string }
        purpose:
          type: string
          enum: [image, avatar, pattern_pdf]
          description: What the file is for. Avatars become public once set on a profile with a handle; everything else stays private.
    UploadResponse:
      type: object
      properties:
        uploadURL: { type: string }
        objectPath: { type: string }
      required: [uploadURL, objectPath]

