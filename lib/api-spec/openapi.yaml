openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Sewspace digital sewing studio API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: studio
    description: Sewing studio data
  - name: ai
    description: AI-ready sewing tools
  - name: storage
    description: File upload helpers
  - name: public
    description: Read-only endpoints that work without signing in
  - name: feed
    description: Posts and feeds
  - name: social
    description: Likes, comments, saves, follows, blocks and reports
  - name: admin
    description: Report review (ADMIN_USER_IDS only)
  - name: catalog
    description: Shared pattern and product pages, and reviews
  - name: challenges
    description: Hashtag challenges with entries
  - name: forum
    description: Boards, topics, replies, votes and polls
  - name: drafts
    description: One private draft per flow (post, project, stash, topic)
  - name: onboarding
    description: Pip's setup questions (private to you)
paths:
  /public/profiles/{handle}:
    get:
      operationId: getPublicProfile
      tags: [public]
      summary: Public profile by handle. Works signed out; returns public fields only.
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Public profile fields only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicProfile" }
        "404": { description: Profile not found }
  /public/profiles/{handle}/posts:
    get:
      operationId: getProfilePosts
      tags: [public]
      summary: A person's posts that the viewer may see, newest first. Works signed out.
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: A page of posts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedPage" }
        "404": { description: Profile not found (or blocked either way) }
  /public/profiles/{handle}/makes:
    get:
      operationId: getProfileMakes
      tags: [public]
      summary: A person's makes that the viewer may see, finished first. Works signed out.
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Finished makes and shared makes in progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileMakes" }
        "404": { description: Profile not found (or blocked either way) }
  /public/profiles/{handle}/used:
    get:
      operationId: getProfileUsed
      tags: [public]
      summary: Patterns, fabrics and threads used in the person's makes, each with the makes it was used in. Only items and makes the viewer may see.
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Used products
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileUsed" }
        "404": { description: Profile not found (or blocked either way) }
  /public/makes/{id}:
    get:
      operationId: getPublicMake
      tags: [public]
      summary: A make (project) the viewer is allowed to see. Works signed out for public makes.
      description: Returns 404 when the make doesn't exist or isn't visible to this viewer (private, followers-only for a non-follower, or a block either way). Never includes measurements or pattern PDFs.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The make
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicMake" }
        "404": { description: Not found or not visible }
  /visibility/{kind}/{id}:
    put:
      operationId: setVisibility
      tags: [studio]
      summary: Change who can see one of your makes, fabrics, threads or patterns
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [project, fabric, thread, pattern] }
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VisibilityChange" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisibilityResult" }
        "404": { description: Not one of your items }
  /public/posts/{id}:
    get:
      operationId: getPublicPost
      tags: [public]
      summary: A post the viewer may see. Works signed out for public posts.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedPost" }
        "404": { description: Not found or not visible }
  /public/tags/{tag}:
    get:
      operationId: getTagPosts
      tags: [public]
      summary: "Public posts with a hashtag, newest first. Works signed out; blocks apply."
      parameters:
        - { name: tag, in: path, required: true, schema: { type: string } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagPage" }
        "404": { description: Not a valid hashtag }
  /public/search/posts:
    get:
      operationId: searchPosts
      tags: [public]
      summary: "Public posts whose caption contains q (at least 2 characters), newest first. Works signed out; blocks apply."
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 80 } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: A page of posts (empty when q is shorter than 2 characters)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedPage" }
  /public/search/people:
    get:
      operationId: searchPeople
      tags: [public]
      summary: "Up to 20 people whose handle starts with q or whose name contains it. Works signed out; blocked people are left out."
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 80 } }
      responses:
        "200":
          description: Exact handle first, then handles starting with q, then names
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PublicPerson" }
  /public/search/tags:
    get:
      operationId: searchTags
      tags: [public]
      summary: "Up to 10 hashtags starting with q, most used first. Counts are public posts only; blocks apply."
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 80 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HashtagCount" }
  /hashtags/suggest:
    get:
      operationId: suggestHashtags
      tags: [feed]
      summary: "Up to 6 hashtags: by prefix (q), or with no q from the tagged make, pattern, fabric, challenge and your recent tags."
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: projectId, in: query, required: false, schema: { type: integer } }
        - { name: patternId, in: query, required: false, schema: { type: integer } }
        - { name: fabricId, in: query, required: false, schema: { type: integer } }
        - { name: challenge, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HashtagCount" }
  /public/explore:
    get:
      operationId: getExploreFeed
      tags: [public]
      summary: Recent public posts from everyone (Discover). Works signed out; hides people you've blocked or who blocked you.
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - name: kind
          in: query
          required: false
          schema: { type: string, enum: [all, photo, status, make], default: all }
        - name: sort
          in: query
          required: false
          description: "recent: newest first. popular: most liked in the last 14 days."
          schema: { type: string, enum: [recent, popular], default: recent }
      responses:
        "200":
          description: A page of posts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedPage" }
  /public/explore/cards:
    get:
      operationId: getExploreCards
      tags: [public]
      summary: "Explore: photo posts, fabric posts, pattern pages, challenges and forum threads as one mixed list (30 a page). Works signed out (public only); signed in you also see followers-only posts from people you follow. Blocks apply and things you hid are left out."
      parameters:
        - name: tab
          in: query
          required: false
          schema: { type: string, enum: [explore, forum, challenges, patterns, fabric], default: explore }
        - name: sub
          in: query
          required: false
          description: "explore/patterns: for-you, dresses, tops, bottoms, outerwear, bags, upcycle. forum: all, fitting, pattern-help, fabric, machines, show-tell. challenges: all, running, soon, finished. fabric: all, linen, cotton, satin, viscose, crepe, hauls. Anything else means the first one."
          schema: { type: string }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: A page of cards
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExploreCardsPage" }
  /public/posts/{id}/comments:
    get:
      operationId: getPostComments
      tags: [public]
      summary: Comments on a post the viewer may see, oldest first, each with its replies. Hides comments from people on the other side of a block.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Comment" }
        "404": { description: Post not found or not visible }
  /posts/{id}/comments:
    post:
      operationId: createComment
      tags: [social]
      summary: Comment on a post you may see, or reply to a top-level comment on it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommentInput" }
      responses:
        "201":
          description: The new comment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400": { description: "Empty, too long, or not a valid reply" }
        "404": { description: Post not found or not visible }
        "429": { description: Too many comments }
  /comments/{id}:
    delete:
      operationId: deleteComment
      tags: [social]
      summary: Delete your comment, or any comment on your post.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
        "404": { description: Not found or not yours to delete }
  /posts/{id}/like:
    put:
      operationId: likePost
      tags: [social]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Liked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LikeState" }
        "404": { description: Post not found or not visible }
    delete:
      operationId: unlikePost
      tags: [social]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Not liked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LikeState" }
        "404": { description: Post not found or not visible }
  /posts/{id}/save:
    put:
      operationId: savePost
      tags: [social]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveState" }
        "404": { description: Post not found or not visible }
    delete:
      operationId: unsavePost
      tags: [social]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Not saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveState" }
  /saved:
    get:
      operationId: getSavedPosts
      tags: [social]
      summary: Posts you saved that you may still see, most recently saved first.
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: A page of posts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedPage" }
  /follows/{handle}:
    put:
      operationId: followProfile
      tags: [social]
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Following
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FollowState" }
        "400": { description: You can't follow yourself }
        "404": { description: Profile not found (or blocked either way) }
    delete:
      operationId: unfollowProfile
      tags: [social]
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Not following
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FollowState" }
        "404": { description: Profile not found }
  /blocks:
    get:
      operationId: listBlocks
      tags: [social]
      summary: People you have blocked.
      responses:
        "200":
          description: Blocked people
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BlockedPerson" }
  /blocks/{handle}:
    put:
      operationId: blockProfile
      tags: [social]
      summary: Block someone. Ends follows both ways; you stop seeing each other's profiles, posts, makes and comments.
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Blocked }
        "400": { description: You can't block yourself }
        "404": { description: Profile not found }
    delete:
      operationId: unblockProfile
      tags: [social]
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Unblocked (or wasn't blocked) }
  /reports:
    post:
      operationId: createReport
      tags: [social]
      summary: Report a post, comment or profile you can see to the admins.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportInput" }
      responses:
        "201":
          description: Report filed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportReceipt" }
        "404": { description: Nothing to report there (not found or not visible) }
        "429": { description: Too many reports }
  /admin/reports:
    get:
      operationId: listReports
      tags: [admin]
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [open, removed, dismissed], default: open }
      responses:
        "200":
          description: Reports, oldest open first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Report" }
        "403": { description: Not an admin }
  /admin/reports/{id}/resolve:
    post:
      operationId: resolveReport
      tags: [admin]
      summary: "remove: delete the reported post or comment and close every open report on it. dismiss: close this report."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportResolution" }
      responses:
        "200":
          description: The resolved report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "400": { description: Profiles can't be removed; dismiss instead }
        "403": { description: Not an admin }
        "404": { description: Not found }
  /public/catalog:
    get:
      operationId: listCatalog
      tags: [public]
      summary: Browse or search shared pattern and product pages. Works signed out.
      parameters:
        - name: kind
          in: query
          required: false
          schema: { type: string, enum: [pattern, product], default: pattern }
        - { name: q, in: query, required: false, description: "Matches name, designer and category", schema: { type: string, maxLength: 80 } }
        - { name: category, in: query, required: false, schema: { type: string, maxLength: 40 } }
        - { name: difficulty, in: query, required: false, description: "Comma-separated: beginner, intermediate, advanced", schema: { type: string, maxLength: 60 } }
        - { name: source, in: query, required: false, description: "Comma-separated: seams_club, free, designer", schema: { type: string, maxLength: 60 } }
        - { name: minRating, in: query, required: false, schema: { type: number, minimum: 0, maximum: 5 } }
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: [made, rating, new], default: made }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: "24 entries at a time, with the total and filter counts. Makes and ratings come from public data only"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogList" }
  /public/catalog/{kind}/{slug}:
    get:
      operationId: getCatalogPage
      tags: [public]
      summary: A shared pattern or product page with its numbers, the makes the viewer may see, and the viewer's own review.
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [pattern, product] }
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogPage" }
        "404": { description: Not found }
  /public/catalog/{kind}/{slug}/reviews:
    get:
      operationId: getCatalogReviews
      tags: [public]
      summary: Reviews, most helpful first. Hides reviews from people on the other side of a block.
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [pattern, product] }
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Review" }
        "404": { description: Not found }
  /public/catalog-entries/{id}:
    get:
      operationId: getCatalogEntry
      tags: [public]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogEntry" }
        "404": { description: Not found }
  /catalog:
    post:
      operationId: createCatalogEntry
      tags: [catalog]
      summary: Add a shared page. If one with the same name and maker exists, returns that one (200) instead.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogInput" }
      responses:
        "200":
          description: An entry with this name and maker already existed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogEntry" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogEntry" }
        "400": { description: Invalid }
        "409": { description: Choose a handle first }
        "429": { description: Too many new pages today }
  /catalog/{id}:
    patch:
      operationId: updateCatalogEntry
      tags: [catalog]
      summary: Correct an entry you added (admins can correct any).
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogEntry" }
        "404": { description: Not found or not yours to edit }
    delete:
      operationId: deleteCatalogEntry
      tags: [catalog]
      summary: "Delete a page you added, while nobody else uses it (no one else's review, save, linked item or forum post)."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
        "404": { description: Not found or not yours }
        "409": { description: Someone else uses this page }
  /catalog/{id}/sizes:
    put:
      operationId: setCatalogSizes
      tags: [catalog]
      summary: "Replace a pattern page's size chart (the page's creator or an admin). Body measurements in cm."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sizes:
                  type: array
                  maxItems: 60
                  items: { $ref: "#/components/schemas/CatalogSize" }
              required: [sizes]
      responses:
        "200":
          description: The size chart
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogSize" }
        "400": { description: "Invalid, or two sizes with the same label" }
        "404": { description: Not found or not yours to edit }
  /catalog/{id}/save:
    put:
      operationId: saveCatalogEntry
      tags: [catalog]
      summary: Save a pattern (the heart). Private to you.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogSaveState" }
        "404": { description: Not found }
        "429": { description: Too many saves this hour }
    delete:
      operationId: unsaveCatalogEntry
      tags: [catalog]
      summary: Remove a saved pattern.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Not saved any more
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogSaveState" }
        "429": { description: Too many saves this hour }
  /catalog/{id}/me:
    get:
      operationId: getCatalogMe
      tags: [catalog]
      summary: "Your own extras for a pattern page: stash matches, closest size, library, makes. Only you see these."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Your extras
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogMe" }
        "404": { description: Not found }
  /catalog/{id}/review:
    put:
      operationId: saveReview
      tags: [catalog]
      summary: Write or update your review.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewInput" }
      responses:
        "200":
          description: Your review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        "400": { description: "Invalid, or the make isn't yours" }
        "404": { description: Not found }
        "409": { description: Choose a handle first }
    delete:
      operationId: deleteReview
      tags: [catalog]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted (or there was none) }
  /reviews/{id}/helpful:
    put:
      operationId: markReviewHelpful
      tags: [catalog]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Marked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HelpfulState" }
        "400": { description: Not on your own review }
        "404": { description: Not found }
        "429": { description: Too many helpful votes this hour }
    delete:
      operationId: unmarkReviewHelpful
      tags: [catalog]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Unmarked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HelpfulState" }
        "429": { description: Too many helpful votes this hour }
  /catalog/{id}/library:
