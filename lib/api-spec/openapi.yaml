components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    Search:
      name: search
      in: query
      required: false
      schema:
        type: string
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: integer
    StepId:
      name: stepId
      in: path
      required: true
      schema:
        type: integer
    PhotoId:
      name: photoId
      in: path
      required: true
      schema:
        type: integer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    Profile:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        handle: { type: string, nullable: true }
        bio: { type: string }
        avatarUrl: { type: string, nullable: true }
        joinedAt: { type: string, format: date-time }
        experience: { type: string }
        favoriteGarments:
          type: array
          items: { type: string }
        units: { type: string, enum: [metric, imperial] }
        needsHandle: { type: boolean, description: True until the user has chosen a handle }
        isAdmin: { type: boolean, description: True for ADMIN_USER_IDS (shows report review) }
      required: [id, name, handle, bio, avatarUrl, joinedAt, experience, favoriteGarments, units, needsHandle, isAdmin]
    PublicProfile:
      type: object
      description: Fields of a profile that anyone may see. Never includes units, experience or other private data.
      properties:
        handle: { type: string }
        name: { type: string }
        bio: { type: string }
        avatarUrl: { type: string, nullable: true }
        joinedAt: { type: string, format: date-time }
        isMe: { type: boolean, description: True when this is the signed-in viewer's own profile }
        stats: { $ref: "#/components/schemas/ProfileStats" }
        followedByMe: { type: boolean, description: True when the signed-in viewer follows this person }
      required: [handle, name, bio, avatarUrl, joinedAt, isMe, stats, followedByMe]
    ProfileStats:
      type: object
      description: Posts and makes count only what this viewer may see. The followersOnly counts are the followers-only posts and makes the viewer can't see (0 for the owner and followers); private items are never counted.
      properties:
        posts: { type: integer }
        makes: { type: integer }
        followers: { type: integer }
        following: { type: integer }
        followersOnlyPosts: { type: integer }
        followersOnlyMakes: { type: integer }
        challengesEntered: { type: integer, description: Challenges with at least one entry the viewer can see }
      required: [posts, makes, followers, following, followersOnlyPosts, followersOnlyMakes, challengesEntered]
    MakeSummary:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        status: { type: string }
        progress: { type: integer }
        size: { type: string, nullable: true }
        alterations: { type: string, nullable: true }
        coverImageUrl: { type: string, nullable: true }
        completedAt: { type: string, format: date, nullable: true }
        publishedAt: { type: string, format: date-time, nullable: true }
        visibility: { $ref: "#/components/schemas/Visibility" }
        materials:
          type: array
          items: { $ref: "#/components/schemas/PublicMaterial" }
      required: [id, name, status, progress, size, alterations, coverImageUrl, completedAt, publishedAt, visibility, materials]
    ProfileMakes:
      type: object
      properties:
        finished:
          type: array
          items: { $ref: "#/components/schemas/MakeSummary" }
        inProgress:
          type: array
          items: { $ref: "#/components/schemas/MakeSummary" }
      required: [finished, inProgress]
    UsedProduct:
      allOf:
        - { $ref: "#/components/schemas/PublicMaterial" }
        - type: object
          properties:
            makes:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer }
                  name: { type: string }
                  coverImageUrl: { type: string, nullable: true }
                required: [id, name, coverImageUrl]
          required: [makes]
    ProfileUsed:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/UsedProduct" }
      required: [items]
    Visibility:
      type: string
      enum: [public, followers, private]
      description: "public: anyone, signed out included. followers: your followers. private: only you."
    VisibilityChange:
      type: object
      properties:
        visibility: { $ref: "#/components/schemas/Visibility" }
      required: [visibility]
    VisibilityResult:
      type: object
      properties:
        kind: { type: string, enum: [project, fabric, thread, pattern] }
        id: { type: integer }
        visibility: { $ref: "#/components/schemas/Visibility" }
      required: [kind, id, visibility]
    PublicPerson:
      type: object
      properties:
        handle: { type: string }
        name: { type: string }
        avatarUrl: { type: string, nullable: true }
      required: [handle, name, avatarUrl]
    PublicMaterial:
      type: object
      description: A pattern, fabric or thread used in a make, shown only when the viewer may see it.
      properties:
        kind: { type: string, enum: [pattern, fabric, thread] }
        id: { type: integer }
        name: { type: string }
        detail: { type: string, nullable: true, description: "e.g. designer, or fibre and composition" }
        color: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true }
        catalog:
          allOf: [{ $ref: "#/components/schemas/CatalogRef" }]
          nullable: true
          description: The shared page this item is linked to, if any
      required: [kind, id, name, detail, color, imageUrl, catalog]
    PublicMake:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        status: { type: string }
        progress: { type: integer }
        size: { type: string, nullable: true }
        description: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        alterations: { type: string, nullable: true }
        problems: { type: string, nullable: true }
        solutions: { type: string, nullable: true }
        coverImageUrl: { type: string, nullable: true }
        completedAt: { type: string, format: date, nullable: true }
        publishedAt: { type: string, format: date-time, nullable: true }
        visibility: { $ref: "#/components/schemas/Visibility" }
        isOwner: { type: boolean }
        owner:
          allOf: [{ $ref: "#/components/schemas/PublicPerson" }]
          nullable: true
        steps:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              completed: { type: boolean }
            required: [title, completed]
        photos:
          type: array
          items:
            type: object
            properties:
              url: { type: string }
              caption: { type: string, nullable: true }
            required: [url, caption]
        materials:
          type: array
          items: { $ref: "#/components/schemas/PublicMaterial" }
      required: [id, name, status, progress, size, description, notes, alterations, problems, solutions, coverImageUrl, completedAt, publishedAt, visibility, isOwner, owner, steps, photos, materials]
    MediaInput:
      type: object
      properties:
        objectPath: { type: string, description: "objectPath returned by /storage/uploads/request-url (an image you uploaded)" }
      required: [objectPath]
    Media:
      type: object
      properties:
        id: { type: integer }
        url: { type: string, description: Full image, at most 1600 px }
        thumbUrl: { type: string, description: Thumbnail, at most 400 px }
        width: { type: integer }
        height: { type: integer }
        color: { type: string, nullable: true, description: Dominant colour as a placeholder while loading }
      required: [id, url, thumbUrl, width, height, color]
    PostTag:
      type: object
      properties:
        kind: { type: string, enum: [make, pattern, fabric] }
        id: { type: integer }
        name: { type: string }
      required: [kind, id, name]
    FeedPost:
      type: object
      properties:
        id: { type: integer }
        kind: { type: string, enum: [status, photo] }
        caption: { type: string }
        visibility: { $ref: "#/components/schemas/Visibility" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        author: { $ref: "#/components/schemas/PublicPerson" }
        isOwner: { type: boolean }
        media:
          type: array
          items: { $ref: "#/components/schemas/Media" }
        tags:
          type: array
          description: Tagged make, pattern or fabric, only when the viewer may see it.
          items: { $ref: "#/components/schemas/PostTag" }
        likeCount: { type: integer }
        commentCount: { type: integer }
        likedByMe: { type: boolean }
        savedByMe: { type: boolean }
        challenges:
          type: array
          description: Challenges this post is a (not removed) entry in
          items: { $ref: "#/components/schemas/ChallengeRef" }
      required: [id, kind, caption, visibility, createdAt, updatedAt, author, isOwner, media, tags, likeCount, commentCount, likedByMe, savedByMe, challenges]
    FeedPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FeedPost" }
        nextCursor: { type: string, nullable: true, description: Pass back as ?cursor= for the next page; null at the end }
      required: [items, nextCursor]
    PostInput:
      type: object
      properties:
