<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SewSpace mobile — forum</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Poppins:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#000}a:hover{color:#2f55d4}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background-color: #f2f2f2; background-image: radial-gradient(#d4d4d4 1px, transparent 1px); background-size: 20px 20px; font-family: 'Inter', system-ui, sans-serif; color: #000">

  <header style="position: absolute; left: 12px; right: 12px; top: 12px; z-index: 2; background: #fff; border-radius: 24px; padding: 6px; box-shadow: rgba(0,0,0,.2) 0 10px 10px -5px">
    <div role="tablist" aria-label="Explore sections" style="display: flex; gap: 4px">
      <button role="tab" aria-selected="false" style="flex: 1; min-height: 42px; border: 0; border-radius: 18px; background: transparent; font: inherit; font-size: 14px; font-weight: 700">Makes</button>
      <button role="tab" aria-selected="true" style="flex: 1; min-height: 42px; border: 0; border-radius: 18px; background: #000; color: #fff; font: inherit; font-size: 14px; font-weight: 700">Forum</button>
      <button role="tab" aria-selected="false" style="flex: 1; min-height: 42px; border: 0; border-radius: 18px; background: transparent; font: inherit; font-size: 14px; font-weight: 700">Challenges</button>
    </div>
  </header>

  <div style="position: absolute; left: 0; right: 0; top: 76px; bottom: 0; overflow: hidden; padding: 0 12px">
    <div role="tablist" aria-label="Filter by type" style="display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 4px">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="6">
        <button role="tab" aria-selected="{{f.selected}}" onClick="{{f.pick}}" style="flex-shrink: 0; min-height: 38px; padding: 0 13px; border-radius: 3000px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; {{f.style}}">{{f.label}}</button>
      </sc-for>
    </div>

    <div style="margin-top: 8px; display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{topics}}" as="t" hint-placeholder-count="4">
        <article style="background: #fff; border-radius: 24px; padding: 14px">
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 11px; color: #555">
            <span style="border-radius: 3000px; padding: 3px 9px; font-weight: 700; {{t.badge}}">{{t.typeLabel}}</span>
            <sc-if value="{{t.solved}}" hint-placeholder-val="{{false}}"><span style="border-radius: 3000px; padding: 3px 9px; background: #e6e51e; color: #000; font-weight: 700">Solved</span></sc-if>
            <span>@{{t.h}} · {{t.when}}</span>
          </div>
          <h2 style="margin: 8px 0 0; font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 17px; line-height: 1.3; letter-spacing: -0.03em"><a href="#" style="text-decoration: none">{{t.title}}</a></h2>
          <sc-if value="{{t.isPoll}}" hint-placeholder-val="{{false}}">
            <div role="group" aria-label="Poll options" style="margin-top: 10px; display: flex; flex-direction: column; gap: 6px">
              <sc-for list="{{poll}}" as="o" hint-placeholder-count="4">
                <button onClick="{{o.pick}}" aria-pressed="{{o.chosen}}" style="position: relative; overflow: hidden; display: flex; align-items: center; justify-content: space-between; min-height: 42px; padding: 0 12px; border-radius: 12px; font: inherit; font-size: 13px; font-weight: 600; text-align: left; cursor: pointer; {{o.style}}">
                  <span style="position: absolute; left: 0; top: 0; bottom: 0; background: {{o.barColor}}; width: {{o.bar}}"></span>
                  <span style="position: relative">{{o.label}}</span><span style="position: relative; font-weight: 700">{{o.pctText}}</span>
                </button>
              </sc-for>
              <div style="font-size: 11px; color: #555">{{pollMeta}}</div>
            </div>
          </sc-if>
          <sc-if value="{{t.answer}}" hint-placeholder-val="{{false}}">
            <div style="margin-top: 8px; border-radius: 14px; background: #f2f2f2; padding: 9px 11px; font-size: 13px; line-height: 1.45"><b>Accepted:</b> {{t.answer}}</div>
          </sc-if>
          <div style="margin-top: 10px; display: flex; align-items: center; gap: 12px; font-size: 13px; font-weight: 700">
            <button onClick="{{t.vote}}" aria-pressed="{{t.votedAttr}}" aria-label="Upvote" style="display: inline-flex; align-items: center; gap: 4px; min-height: 36px; padding: 0 12px; border: 0; border-radius: 3000px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; {{t.voteStyle}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"></path></svg>{{t.votes}}</button>
            <span style="display: inline-flex; align-items: center; gap: 5px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path></svg>{{t.replies}}</span>
          </div>
        </article>
      </sc-for>
    </div>
  </div>

  <button onClick="{{openSheet}}" style="position: absolute; right: 18px; bottom: 102px; z-index: 3; display: inline-flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 20px; border: 0; border-radius: 3000px; background: #e6e51e; font: inherit; font-size: 15px; font-weight: 700; box-shadow: rgba(0,0,0,.25) 0 10px 16px -6px; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14 M5 12h14"></path></svg>Ask or share</button>

  <nav aria-label="App" style="position: absolute; left: 12px; right: 12px; bottom: 16px; z-index: 3; display: flex; align-items: center; justify-content: space-between; background: #fff; border-radius: 30px; padding: 8px 12px; box-shadow: rgba(0,0,0,.2) 0 10px 14px -5px">
    <a href="MFeed.dc.html" aria-label="Home" style="width: 52px; height: 48px; display: grid; place-items: center; border-radius: 18px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M9 22V12h6v10"></path></svg></a>
    <a href="MForum.dc.html" aria-label="Explore" aria-current="page" style="width: 52px; height: 48px; display: grid; place-items: center; border-radius: 18px; background: #000"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z m4.24 5.76-2.12 6.36-6.36 2.12 2.12-6.36 6.36-2.12z"></path></svg></a>
    <a href="MCompose.dc.html" aria-label="New post" style="width: 58px; height: 52px; display: grid; place-items: center; border-radius: 20px; background: #e6e51e"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14 M5 12h14"></path></svg></a>
    <a href="#" aria-label="My studio" style="width: 52px; height: 48px; display: grid; place-items: center; border-radius: 18px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h18v18H3z M8 7v7 M12 7v4 M16 7v9"></path></svg></a>
    <a href="MProfile.dc.html" aria-label="My profile" style="width: 52px; height: 48px; display: grid; place-items: center; border-radius: 18px"><span style="width: 28px; height: 28px; border-radius: 50%; background: #000; color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700">E</span></a>
  </nav>

  <sc-if value="{{sheetOpen}}" hint-placeholder-val="{{false}}">
    <button aria-label="Close" onClick="{{closeSheet}}" style="position: absolute; inset: 0; z-index: 5; border: 0; background: rgba(0,0,0,.45); cursor: pointer"></button>
    <div role="dialog" aria-label="What would you like to post?" style="position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 6; background: #fff; border-radius: 30px; padding: 12px 14px 16px">
      <span style="display: block; width: 44px; height: 5px; margin: 0 auto 14px; border-radius: 3000px; background: #d4d4d4"></span>
      <h2 style="margin: 0 4px; font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.04em">What would you like to post?</h2>
      <div style="margin-top: 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{kinds}}" as="k" hint-placeholder-count="5">
          <button style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-height: 96px; padding: 12px; border: 0; border-radius: 20px; font: inherit; text-align: left; cursor: pointer; {{k.style}}">
            <span style="font-weight: 700; font-size: 15px">{{k.label}}</span>
            <span style="font-size: 12px; line-height: 1.4; opacity: .85">{{k.desc}}</span>
          </button>
        </sc-for>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { filter: 'all', voted: {}, poll: null, sheet: false }; }
  renderVals() {
    var self = this, s = this.state;
    var T = {
      question: { label: 'Question', badge: 'background:#466cf3;color:#fff' },
      poll: { label: 'Poll', badge: 'background:#e6e51e;color:#000' },
      rec: { label: 'Recommendation', badge: 'background:#ff8562;color:#000' },
      info: { label: 'Info', badge: 'background:#000;color:#fff' },
      post: { label: 'Show & tell', badge: 'background:#fff;color:#000;border:1px solid #000' }
    };
    var all = [
      { id: 2, type: 'poll', h: 'hemline.hal', when: '6h', votes: 41, replies: 87, title: 'Which trouser closure do you actually trust?', isPoll: true },
      { id: 1, type: 'question', h: 'slowseams', when: '3h', votes: 58, replies: 24, title: 'How do I stop linen shifting while I cut?', solved: true, answer: 'Starch it, cut single layer, use weights instead of pins.' },
      { id: 3, type: 'rec', h: 'tilly.tacks', when: '1d', votes: 33, replies: 19, title: 'Recommend me a first trousers pattern' },
      { id: 4, type: 'info', h: 'junesews', when: '2d', votes: 214, replies: 36, title: 'Guide: how to pre-wash every fibre, in one table' },
      { id: 5, type: 'post', h: 'kofi_tailors', when: '2d', votes: 96, replies: 41, title: 'My first wrap vest. What would you change?' }
    ];
    var shown = all.filter(function (t) { return s.filter === 'all' || t.type === s.filter; });
    var defs = [['all', 'All'], ['question', 'Questions'], ['poll', 'Polls'], ['rec', 'Recs'], ['info', 'Info'], ['post', 'Show & tell']];
    var opts = [['Invisible zip', 42], ['Fly front zip', 31], ['Buttons', 18], ['Elastic, always', 9]];
    var voted = s.poll !== null;
    return {
      sheetOpen: s.sheet,
      openSheet: function () { self.setState({ sheet: true }); },
      closeSheet: function () { self.setState({ sheet: false }); },
      filters: defs.map(function (f) {
        var on = s.filter === f[0];
        return { label: f[1], selected: on ? 'true' : 'false', style: on ? 'background:#000;color:#fff;border:1px solid #000' : 'background:#fff;color:#000;border:1px solid #e6e6e6', pick: function () { self.setState({ filter: f[0] }); } };
      }),
      topics: shown.map(function (t) {
        var v = !!s.voted[t.id];
        return {
          title: t.title, h: t.h, when: t.when, replies: t.replies, typeLabel: T[t.type].label, badge: T[t.type].badge,
          solved: !!t.solved, isPoll: !!t.isPoll, answer: t.answer || '',
          votes: t.votes + (v ? 1 : 0), votedAttr: v ? 'true' : 'false', voteStyle: v ? 'background:#e6e51e;color:#000' : 'background:#f2f2f2;color:#000',
          vote: function () { var n = Object.assign({}, self.state.voted); n[t.id] = !n[t.id]; self.setState({ voted: n }); }
        };
      }),
      poll: opts.map(function (o, n) {
        var chosen = s.poll === n;
        return { label: o[0], chosen: chosen ? 'true' : 'false', pctText: voted ? o[1] + '%' : '', bar: voted ? o[1] + '%' : '0%', barColor: chosen ? '#e6e51e' : '#e6e6e6',
          style: voted ? (chosen ? 'background:#fff;color:#000;border:2px solid #000' : 'background:#fff;color:#000;border:1px solid #e6e6e6') : 'background:#fff;color:#000;border:1px solid #000',
          pick: function () { self.setState({ poll: n }); } };
      }),
      pollMeta: voted ? '313 votes · 2 days left' : '312 votes · vote to see results',
      kinds: [
        { label: 'Question', desc: 'Get help with a fit, fabric or technique', style: 'background:#466cf3;color:#fff' },
        { label: 'Poll', desc: 'Let the community vote', style: 'background:#e6e51e;color:#000' },
        { label: 'Recommendation', desc: 'Ask for a pattern, fabric or tool', style: 'background:#ff8562;color:#000' },
        { label: 'Info & guides', desc: 'Share a tip, guide or event', style: 'background:#000;color:#fff' },
        { label: 'Show & tell', desc: 'Share a make or work in progress', style: 'background:#f2f2f2;color:#000' }
      ]
    };
  }
}
</script>
</body>
</html>
