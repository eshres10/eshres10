<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Seams Club mobile — Fabric stash</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Poppins:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#000}a:hover{color:#2f55d4}
button{cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background-color: #f2f2f2; background-image: radial-gradient(#d4d4d4 1px, transparent 1px); background-size: 20px 20px; font-family: 'Inter', system-ui, sans-serif; color: #000">

  <header style="position: absolute; left: 0; right: 0; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; min-height: 64px; background: #fff; padding: 8px 12px 8px 16px; border-bottom: 1px solid #e6e6e6">
    <span style="flex: 1"><span style="display: block; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #555">My studio</span><span style="display: block; font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 19px; letter-spacing: -0.04em">Fabric stash</span></span>
    <button aria-label="Search my studio" style="width: 44px; height: 44px; border: 0; border-radius: 50%; background: #f2f2f2; display: grid; place-items: center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="{{i.search}}"></path></svg></button>
    <a href="FlowStash.dc.html" aria-label="Add fabric" style="width: 44px; height: 44px; border-radius: 50%; background: #e6e51e; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="{{i.plus}}"></path></svg></a>
  </header>

  <nav aria-label="Studio sections" style="position: absolute; left: 0; right: 0; top: 76px; z-index: 2; display: flex; gap: 6px; overflow-x: auto; padding: 0 12px">
    <a href="MStudio.dc.html" style="flex-shrink: 0; display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 3000px; text-decoration: none; font-size: 13px; font-weight: 700; background: #fff; color: #000">Overview</a><a href="MStash.dc.html" aria-current="page" style="flex-shrink: 0; display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 3000px; text-decoration: none; font-size: 13px; font-weight: 700; background: #000; color: #fff">Fabric</a><a href="MThreads.dc.html" style="flex-shrink: 0; display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 3000px; text-decoration: none; font-size: 13px; font-weight: 700; background: #fff; color: #000">Thread</a><a href="MPatterns.dc.html" style="flex-shrink: 0; display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 3000px; text-decoration: none; font-size: 13px; font-weight: 700; background: #fff; color: #000">Patterns</a><a href="MMeasurements.dc.html" style="flex-shrink: 0; display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 3000px; text-decoration: none; font-size: 13px; font-weight: 700; background: #fff; color: #000">Measurements</a>
  </nav>

  <main style="position: absolute; left: 0; right: 0; top: 128px; bottom: 0; overflow-y: auto; padding: 0 12px 100px">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 8px; padding: 0 4px"><span style="flex: 1; font-size: 13px; color: #555"><b style="color: #000">{{count}}</b> · {{metres}}</span>
        <div role="radiogroup" aria-label="Units" style="display: flex; gap: 2px; background: #fff; border-radius: 3000px; padding: 3px"><sc-for list="{{units}}" as="u" hint-placeholder-count="2"><button role="radio" aria-checked="{{u.on}}" onClick="{{u.pick}}" style="min-height: 32px; padding: 0 10px; border: 0; border-radius: 3000px; font: inherit; font-size: 12px; font-weight: 700; {{u.style}}">{{u.label}}</button></sc-for></div>
      </div>
      <div role="group" aria-label="Filter by type" style="display: flex; gap: 6px; overflow-x: auto">
        <sc-for list="{{chips}}" as="c" hint-placeholder-count="6"><button aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="flex-shrink: 0; min-height: 36px; padding: 0 13px; border-radius: 3000px; font: inherit; font-size: 13px; font-weight: 700; {{c.style}}">{{c.label}}</button></sc-for>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{items}}" as="f" hint-placeholder-count="6">
          <a href="FlowStash.dc.html" style="background: #fff; border-radius: 22px; overflow: hidden; text-decoration: none">
            <span style="position: relative; display: block"><img src="{{f.src}}" alt="{{f.name}}" style="display: block; width: 100%; height: 150px; object-fit: cover">
              <span style="position: absolute; left: 8px; top: 8px; display: inline-flex; align-items: center; gap: 4px; border-radius: 3000px; padding: 3px 8px; background: rgba(0,0,0,.72); color: #fff; font-size: 10px; font-weight: 700"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{f.visIcon}}"></path></svg>{{f.vis}}</span>
              <sc-if value="{{f.listed}}" hint-placeholder-val="{{false}}"><span style="position: absolute; right: 8px; top: 8px; border-radius: 3000px; padding: 3px 8px; background: #e6e51e; font-size: 10px; font-weight: 700">In your shop</span></sc-if>
            </span>
            <span style="display: block; padding: 8px 10px 10px"><b style="display: block; font-size: 13px; line-height: 1.25">{{f.name}}</b><span style="display: block; margin-top: 2px; font-size: 12px; color: #555">{{f.meta}}</span></span>
          </a>
        </sc-for>
      </div>
      <sc-if value="{{empty}}" hint-placeholder-val="{{false}}"><p style="margin: 8px; font-size: 14px; color: #555">No {{chipName}} fabric yet.</p></sc-if>
    </div>
  </main>

  <nav aria-label="App" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; display: flex; align-items: center; justify-content: space-between; background: #fff; padding: 8px 20px 24px; border-top: 1px solid #e6e6e6">
    <a href="MFeed.dc.html" style="width: 52px; height: 48px; display: grid; place-items: center; border-radius: 18px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Home" role="img"><path d="{{i.home}}"></path></svg></a>
    <a href="#" style="width: 52px; height: 48px; display: grid; place-items: center; border-radius: 18px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Explore" role="img"><path d="{{i.compass}}"></path></svg></a>
    <a href="FlowPost.dc.html" style="width: 58px; height: 52px; display: grid; place-items: center; border-radius: 20px; background: #e6e51e"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.6" stroke-linecap="round" aria-label="New post" role="img"><path d="{{i.plus}}"></path></svg></a>
    <a href="MStudio.dc.html" aria-current="page" style="width: 52px; height: 48px; display: grid; place-items: center; border-radius: 18px; background: #000"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="My studio" role="img"><path d="{{i.kanban}}"></path></svg></a>
    <a href="MProfile.dc.html" style="width: 52px; height: 48px; display: grid; place-items: center; border-radius: 18px"><span style="width: 28px; height: 28px; border-radius: 50%; background: #000; color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700" aria-label="My profile" role="img">E</span></a>
  </nav>
</div>
</x-dc>

    var i = {"scissors": "M6 3a3 3 0 1 0 0 6 3 3 0 0 0 0-6z M6 15a3 3 0 1 0 0 6 3 3 0 0 0 0-6z M20 4 8.12 15.88 M14.47 14.48 20 20 M8.12 8.12 12 12", "search": "M11 3a8 8 0 1 0 0 16 8 8 0 0 0 0-16z m10 18-4.3-4.3", "home": "m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M9 22V12h6v10", "compass": "M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z m4.24 5.76-2.12 6.36-6.36 2.12 2.12-6.36 6.36-2.12z", "plus": "M12 5v14 M5 12h14", "kanban": "M3 3h18v18H3z M8 7v7 M12 7v4 M16 7v9", "lock": "M5 11h14v10H5z M7 11V7a5 5 0 0 1 10 0v4", "users": "M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M9 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8z M22 21v-2a4 4 0 0 0-3-3.87 M16 3.13a4 4 0 0 1 0 7.75", "globe": "M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z M2 12h20 M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z", "pdf": "M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6", "grid": "M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z", "list": "M8 6h13 M8 12h13 M8 18h13 M3 6h.01 M3 12h.01 M3 18h.01", "sparkle": "M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z", "pen": "M12 20h9 M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"};
    var F = [
      { name: 'Chambray linen', type: 'Linen', m: 2.5, src: '/_blob/5fb545dfebc25a3ab288dabc4d4f34cc', vis: 'private' },

      { name: 'Abstract ikat twill', type: 'Cotton', m: 1.5, src: '/_blob/070d0dbfa6770629d474769422fdcce8', vis: 'followers' },
      { name: 'Royal velvet', type: 'Knit', m: 3.0, src: '/_blob/0b6b01103b47174ea4ec4c0f6db6b9f7', vis: 'private' },
      { name: 'Blue floral lawn', type: 'Cotton', m: 2.0, src: '/_blob/057c4fedc8c7a51b83d0aa3f797c4b48', vis: 'private' },
      { name: 'Linen offcut stack', type: 'Linen', m: 4.6, src: '/_blob/623f53848a0fba7bb103667b6cd6d996', vis: 'private' },
      { name: 'Solid cotton strips', type: 'Cotton', m: 9.2, src: '/_blob/973249613519f24b590d1a29562f5378', vis: 'private' }
    ];
    var types = ['All', 'Linen', 'Cotton', 'Silk', 'Knit', 'Denim'];
    var VI = { 'private': [i.lock, 'Only me'], followers: [i.users, 'Followers'], 'public': [i.globe, 'Public'] };
    var yd = s.unit === 'yd';

    var total = shown.reduce(function (a, f) { return a + f.m; }, 0);
    return {

      chips: types.map(function (t) { var on = s.type === t; return { label: t, on: on ? 'true' : 'false', style: on ? 'border:2px solid #000;background:#000;color:#fff' : 'border:2px solid #fff;background:#fff;color:#000', pick: function () { self.setState({ type: t }); } }; }),
      items: shown.map(function (f) { return { name: f.name, src: f.src, meta: f.type + ' · ' + fmt(f.m), vis: VI[f.vis][1], visIcon: VI[f.vis][0], listed: !!f.listed }; }),

  }
}
</script>
</body>
</html>
