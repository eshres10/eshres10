<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Seams Club mobile — Measurements</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Poppins:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#000}a:hover{color:#2f55d4}
button{cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background-color: #f2f2f2; background-image: radial-gradient(#d4d4d4 1px, transparent 1px); background-size: 20px 20px; font-family: 'Inter', system-ui, sans-serif; color: #000">

  <header style="position: absolute; left: 0; right: 0; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; min-height: 64px; background: #fff; padding: 8px 12px 8px 16px; border-bottom: 1px solid #e6e6e6">
    <span style="flex: 1"><span style="display: block; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #555">My studio</span><span style="display: block; font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 19px; letter-spacing: -0.04em">Measurements</span></span>
    <button aria-label="Search my studio" style="width: 44px; height: 44px; border: 0; border-radius: 50%; background: #f2f2f2; display: grid; place-items: center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="{{i.search}}"></path></svg></button>
    
  </header>

  <nav aria-label="Studio sections" style="position: absolute; left: 0; right: 0; top: 76px; z-index: 2; display: flex; gap: 6px; overflow-x: auto; padding: 0 12px">
    <a href="MStudio.dc.html" style="flex-shrink: 0; display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 3000px; text-decoration: none; font-size: 13px; font-weight: 700; background: #fff; color: #000">Overview</a><a href="MStash.dc.html" style="flex-shrink: 0; display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 3000px; text-decoration: none; font-size: 13px; font-weight: 700; background: #fff; color: #000">Fabric</a><a href="MThreads.dc.html" style="flex-shrink: 0; display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 3000px; text-decoration: none; font-size: 13px; font-weight: 700; background: #fff; color: #000">Thread</a><a href="MPatterns.dc.html" style="flex-shrink: 0; display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 3000px; text-decoration: none; font-size: 13px; font-weight: 700; background: #fff; color: #000">Patterns</a><a href="MMeasurements.dc.html" aria-current="page" style="flex-shrink: 0; display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 3000px; text-decoration: none; font-size: 13px; font-weight: 700; background: #000; color: #fff">Measurements</a>
  </nav>

  <main style="position: absolute; left: 0; right: 0; top: 128px; bottom: 0; overflow-y: auto; padding: 0 12px 100px">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 8px; background: #000; color: #fff; border-radius: 22px; padding: 10px 14px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e6e51e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.lock}}"></path></svg><span style="flex: 1; font-size: 12px; font-weight: 600">Only you can see these. They never appear on shared makes.</span></div>
      <div role="radiogroup" aria-label="Measurement set" style="display: flex; gap: 6px; overflow-x: auto">
        <sc-for list="{{profiles}}" as="p" hint-placeholder-count="2"><button role="radio" aria-checked="{{p.on}}" onClick="{{p.pick}}" style="flex-shrink: 0; min-height: 52px; padding: 6px 14px; border-radius: 18px; font: inherit; text-align: left; {{p.style}}"><b style="display: block; font-size: 13px">{{p.name}}</b><span style="font-size: 11px; opacity: .75">{{p.date}}</span></button></sc-for>
        <a href="Measurements.dc.html" style="flex-shrink: 0; display: inline-flex; align-items: center; min-height: 52px; padding: 0 14px; border: 2px dashed #bbb; border-radius: 18px; text-decoration: none; font-size: 13px; font-weight: 700">+ New set</a>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 0 4px">
        <span style="flex: 1; font-size: 12px; color: #555">{{compareNote}}</span>
        <div role="radiogroup" aria-label="Units" style="display: flex; gap: 2px; background: #fff; border-radius: 3000px; padding: 3px"><sc-for list="{{units}}" as="u" hint-placeholder-count="2"><button role="radio" aria-checked="{{u.on}}" onClick="{{u.pick}}" style="min-height: 32px; padding: 0 12px; border: 0; border-radius: 3000px; font: inherit; font-size: 12px; font-weight: 700; {{u.style}}">{{u.label}}</button></sc-for></div>
      </div>
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
        <section style="background: #fff; border-radius: 24px; padding: 6px 14px 4px">
          <h2 style="margin: 8px 0 2px; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #555">{{g.name}}</h2>
          <dl style="margin: 0">
            <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="4">
              <div style="display: flex; align-items: baseline; gap: 8px; min-height: 44px; padding-top: 10px; border-top: 1px solid #f2f2f2">
                <dt style="flex: 1; font-size: 14px">{{r.label}}</dt>
                <dd style="margin: 0; font-size: 11px; font-weight: 700; {{r.deltaStyle}}">{{r.delta}}</dd>
                <dd style="margin: 0; min-width: 76px; text-align: right; font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 17px; letter-spacing: -0.03em">{{r.value}}</dd>
              </div>
            </sc-for>
          </dl>
        </section>
      </sc-for>
      <a href="Measurements.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 3000px; background: #e6e51e; text-decoration: none; font-weight: 700"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.pen}}"></path></svg>Update measurements</a>
    </div>
  </main>

  <nav aria-label="App" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; display: flex; align-items: center; justify-content: space-between; background: #fff; padding: 8px 20px 24px; border-top: 1px solid #e6e6e6">
    <a href="MFeed.dc.html" style="width: 52px; height: 48px; display: grid; place-items: center; border-radius: 18px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Home" role="img"><path d="{{i.home}}"></path></svg></a>
    <a href="#" style="width: 52px; height: 48px; display: grid; place-items: center; border-radius: 18px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Explore" role="img"><path d="{{i.compass}}"></path></svg></a>
    <a href="FlowPost.dc.html" style="width: 58px; height: 52px; display: grid; place-items: center; border-radius: 20px; background: #e6e51e"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.6" stroke-linecap="round" aria-label="New post" role="img"><path d="{{i.plus}}"></path></svg></a>
    <a href="MStudio.dc.html" aria-current="page" style="width: 52px; height: 48px; display: grid; place-items: center; border-radius: 18px; background: #000"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="My studio" role="img"><path d="{{i.kanban}}"></path></svg></a>
    <a href="MProfile.dc.html" style="width: 52px; height: 48px; display: grid; place-items: center; border-radius: 18px"><span style="width: 28px; height: 28px; border-radius: 50%; background: #000; color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700" aria-label="My profile" role="img">E</span></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { set: 0, unit: 'cm' }; }
  renderVals() {
    var self = this, s = this.state;
    var i = {"scissors": "M6 3a3 3 0 1 0 0 6 3 3 0 0 0 0-6z M6 15a3 3 0 1 0 0 6 3 3 0 0 0 0-6z M20 4 8.12 15.88 M14.47 14.48 20 20 M8.12 8.12 12 12", "search": "M11 3a8 8 0 1 0 0 16 8 8 0 0 0 0-16z m10 18-4.3-4.3", "home": "m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M9 22V12h6v10", "compass": "M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z m4.24 5.76-2.12 6.36-6.36 2.12 2.12-6.36 6.36-2.12z", "plus": "M12 5v14 M5 12h14", "kanban": "M3 3h18v18H3z M8 7v7 M12 7v4 M16 7v9", "lock": "M5 11h14v10H5z M7 11V7a5 5 0 0 1 10 0v4", "users": "M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M9 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8z M22 21v-2a4 4 0 0 0-3-3.87 M16 3.13a4 4 0 0 1 0 7.75", "globe": "M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z M2 12h20 M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z", "pdf": "M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6", "grid": "M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z", "list": "M8 6h13 M8 12h13 M8 18h13 M3 6h.01 M3 12h.01 M3 18h.01", "sparkle": "M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z", "pen": "M12 20h9 M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"};
    var SETS = [
      { name: 'Me', date: 'March 2026', v: { bust: 92, underbust: 78, shoulder: 39, neck: 35, upperarm: 28, waist: 76, highhip: 88, hip: 100, height: 165, back: 41, front: 44, arm: 59, inseam: 76, rise: 26, wrist: 15.5 } },
      { name: 'Me', date: 'Last summer', v: { bust: 94, underbust: 79, shoulder: 39, neck: 35, upperarm: 29, waist: 78, highhip: 89, hip: 101, height: 165, back: 41, front: 44.5, arm: 59, inseam: 76, rise: 26.5, wrist: 15.5 } }
    ];
    var G = [
      ['Upper body', [['bust', 'Bust'], ['underbust', 'Underbust'], ['shoulder', 'Shoulder width'], ['neck', 'Neck'], ['upperarm', 'Upper arm']]],
      ['Waist & hips', [['waist', 'Waist'], ['highhip', 'High hip'], ['hip', 'Full hip'], ['rise', 'Rise']]],
      ['Lengths', [['height', 'Height'], ['back', 'Back length'], ['front', 'Front length'], ['arm', 'Arm length'], ['inseam', 'Inseam'], ['wrist', 'Wrist']]]
    ];
    var cur = SETS[s.set], prev = SETS[s.set === 0 ? 1 : 0];
    var inch = s.unit === 'in';
    var f = function (cm) { return inch ? (Math.round(cm / 2.54 * 4) / 4) + ' in' : cm + ' cm'; };
    return {
      i: i,
      profiles: SETS.map(function (p, n) { var on = s.set === n; return { name: p.name, date: p.date, on: on ? 'true' : 'false', style: on ? 'border:2px solid #000;background:#e6e51e;color:#000' : 'border:2px solid #fff;background:#fff;color:#000', pick: function () { self.setState({ set: n }); } }; }),
      compareNote: s.set === 0 ? 'Compared with last summer' : 'Compared with March 2026',
      units: [['cm', 'cm'], ['in', 'in']].map(function (u) { var on = s.unit === u[0]; return { label: u[1], on: on ? 'true' : 'false', style: on ? 'background:#000;color:#fff' : 'background:transparent;color:#000', pick: function () { self.setState({ unit: u[0] }); } }; }),
      groups: G.map(function (g) { return { name: g[0], rows: g[1].map(function (r) { var d = Math.round((cur.v[r[0]] - prev.v[r[0]]) * 10) / 10; var dd = inch ? Math.round(d / 2.54 * 4) / 4 : d; return { label: r[1], value: f(cur.v[r[0]]), delta: d === 0 ? '' : (d > 0 ? '+' : '\u2212') + Math.abs(dd), deltaStyle: d < 0 ? 'color:#2f55d4' : 'color:#c42a2a' }; }) }; })
    };
  }
}
</script>
</body>
</html>
