<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SewSpace mobile — post and comments</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Poppins:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#000}a:hover{color:#2f55d4}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #f2f2f2; font-family: 'Inter', system-ui, sans-serif; color: #000">

  <header style="position: absolute; left: 12px; right: 12px; top: 12px; z-index: 2; display: flex; align-items: center; gap: 4px; background: #fff; border-radius: 24px; padding: 6px; box-shadow: rgba(0,0,0,.2) 0 10px 10px -5px">
    <a href="MFeed.dc.html" aria-label="Back to feed" style="width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
    <span style="flex: 1; font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: -0.04em">Comments</span>
    <button onClick="{{openSheet}}" aria-label="Post options" aria-expanded="{{sheetOpen}}" style="width: 44px; height: 44px; border: 0; border-radius: 50%; background: #f2f2f2; display: grid; place-items: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="{{i.more}}"></path></svg></button>
  </header>

  <div style="position: absolute; left: 12px; right: 12px; top: 80px; bottom: 92px; overflow: hidden; display: flex; flex-direction: column; gap: 12px">
    <div style="background: #fff; border-radius: 24px; padding: 12px; display: flex; gap: 12px">
      <img src="/_blob/188ffd136f4c0ada8a70caa52d09ec3b" alt="Lavender sprig cotton dress with a drawstring waist" style="width: 64px; height: 80px; flex-shrink: 0; border-radius: 16px; object-fit: cover">
      <div style="font-size: 14px; line-height: 1.45"><b>mara.makes</b> Finally finished my drawstring dress. Lengthened the bodice 2cm and it sits perfectly now.<div style="margin-top: 6px; font-size: 12px; color: #555">2h · 312 likes</div></div>
    </div>

    <div style="background: #fff; border-radius: 24px; padding: 6px 14px; flex: 1; overflow: hidden">
      <sc-for list="{{comments}}" as="c" hint-placeholder-count="5">
        <div style="display: flex; gap: 10px; padding: 12px 0; {{c.indent}}">
          <span style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; {{c.av}}">{{c.initial}}</span>
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 14px; line-height: 1.45"><b>{{c.h}}</b> <sc-if value="{{c.op}}" hint-placeholder-val="{{false}}"><span style="background: #e6e51e; border-radius: 3000px; padding: 1px 7px; font-size: 11px; font-weight: 700">Author</span></sc-if> {{c.text}}</div>
            <div style="margin-top: 4px; display: flex; gap: 14px; font-size: 12px; color: #555; font-weight: 600"><span>{{c.when}}</span><button style="border: 0; background: transparent; padding: 0; font: inherit; color: #555">Reply</button><span>{{c.likes}} likes</span></div>
          </div>
          <button aria-label="Like comment" style="width: 36px; height: 36px; border: 0; background: transparent; display: grid; place-items: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="{{c.fill}}" stroke="{{c.stroke}}" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="{{i.heart}}"></path></svg></button>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="position: absolute; left: 12px; right: 12px; bottom: 16px; display: flex; align-items: center; gap: 8px; background: #fff; border-radius: 28px; padding: 8px 8px 8px 8px; box-shadow: rgba(0,0,0,.2) 0 10px 14px -5px">
    <span style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; background: #000; color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 700">E</span>
    <label style="flex: 1"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Add a comment</span><input placeholder="Reply to junesews…" style="width: 100%; min-height: 44px; border: 0; background: #f2f2f2; border-radius: 16px; padding: 0 14px; font: inherit; font-size: 14px"></label>
    <button aria-label="Post comment" style="width: 44px; height: 44px; border: 0; border-radius: 50%; background: #e6e51e; display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.send}}"></path></svg></button>
  </div>

  <sc-if value="{{sheetOpen}}" hint-placeholder-val="{{false}}">
    <button aria-label="Close options" onClick="{{closeSheet}}" style="position: absolute; inset: 0; z-index: 5; border: 0; background: rgba(0,0,0,.45); cursor: pointer"></button>
    <div role="dialog" aria-label="Post options" style="position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 6; background: #fff; border-radius: 30px; padding: 10px 10px 12px">
      <span style="display: block; width: 44px; height: 5px; margin: 2px auto 10px; border-radius: 3000px; background: #d4d4d4"></span>
      <button style="width: 100%; display: flex; align-items: center; gap: 14px; min-height: 52px; padding: 0 14px; border: 0; border-radius: 18px; background: transparent; font: inherit; font-size: 15px; font-weight: 600; text-align: left"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="{{i.bookmark}}"></path></svg>Save post</button>
      <button style="width: 100%; display: flex; align-items: center; gap: 14px; min-height: 52px; padding: 0 14px; border: 0; border-radius: 18px; background: transparent; font: inherit; font-size: 15px; font-weight: 600; text-align: left"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.send}}"></path></svg>Share or copy link</button>
      <button style="width: 100%; display: flex; align-items: center; gap: 14px; min-height: 52px; padding: 0 14px; border: 0; border-radius: 18px; background: transparent; font: inherit; font-size: 15px; font-weight: 600; text-align: left"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.eyeoff}}"></path></svg>Not interested</button>
      <div style="height: 1px; background: #e6e6e6; margin: 6px 14px"></div>
      <button style="width: 100%; display: flex; align-items: center; gap: 14px; min-height: 52px; padding: 0 14px; border: 0; border-radius: 18px; background: transparent; font: inherit; font-size: 15px; font-weight: 700; color: #c42a2a; text-align: left"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c42a2a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.flag}}"></path></svg>Report post</button>
      <button style="width: 100%; display: flex; align-items: center; gap: 14px; min-height: 52px; padding: 0 14px; border: 0; border-radius: 18px; background: transparent; font: inherit; font-size: 15px; font-weight: 700; color: #c42a2a; text-align: left"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c42a2a" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="{{i.ban}}"></path></svg>Block mara.makes</button>
      <button onClick="{{closeSheet}}" style="margin-top: 8px; width: 100%; min-height: 52px; border: 0; border-radius: 3000px; background: #000; color: #fff; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">Cancel</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sheet: false }; }
  renderVals() {
    var self = this;
    var av = { y: 'background:#e6e51e;color:#000', b: 'background:#466cf3;color:#fff', k: 'background:#000;color:#fff', p: 'background:#ff8562;color:#000' };
    var reply = 'margin-left:42px;border-top:0';
    var top = 'border-top:1px solid #e6e6e6';
    var red = { fill: '#f34646', stroke: '#f34646' }, none = { fill: 'none', stroke: '#000' };
    return {
      sheetOpen: this.state.sheet,
      openSheet: function () { self.setState({ sheet: true }); },
      closeSheet: function () { self.setState({ sheet: false }); },
      i: {
        more: "M12 11a1 1 0 1 0 0 2 1 1 0 0 0 0-2z M19 11a1 1 0 1 0 0 2 1 1 0 0 0 0-2z M5 11a1 1 0 1 0 0 2 1 1 0 0 0 0-2z",
        heart: "M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z",
        send: "m22 2-7 20-4-9-9-4Z M22 2 11 13",
        bookmark: "m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z",
        flag: "M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z M4 22v-7",
        ban: "M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z M4.9 4.9l14.2 14.2",
        eyeoff: "M9.88 9.88a3 3 0 1 0 4.24 4.24 M10.73 5.08A10.4 10.4 0 0 1 12 5c7 0 10 7 10 7a13.2 13.2 0 0 1-1.67 2.68 M6.61 6.61A13.5 13.5 0 0 0 2 12s3 7 10 7a9.7 9.7 0 0 0 5.39-1.61 M2 2l20 20"
      },
      comments: [
        { h: 'junesews', initial: 'J', av: av.y, op: false, text: 'Same alteration on mine! Did you need the swayback too?', when: '1h', likes: '12', indent: 'border-top:0', fill: red.fill, stroke: red.stroke },
        { h: 'mara.makes', initial: 'M', av: av.b, op: true, text: 'Yes, 1 cm took out the pooling completely.', when: '58m', likes: '9', indent: reply, fill: none.fill, stroke: none.stroke },
        { h: 'priya.pins', initial: 'P', av: av.p, op: false, text: 'That sprig print matching at the side seam is unreal.', when: '45m', likes: '6', indent: top, fill: none.fill, stroke: none.stroke },
        { h: 'kofi_tailors', initial: 'K', av: av.k, op: false, text: 'Which lawn is this? The drape looks lovely.', when: '30m', likes: '2', indent: top, fill: none.fill, stroke: none.stroke },
        { h: 'mara.makes', initial: 'M', av: av.b, op: true, text: 'It is tagged on the make! Linked to the fabric page.', when: '22m', likes: '3', indent: reply, fill: none.fill, stroke: none.stroke }
      ]
    };
  }
}
</script>
</body>
</html>
