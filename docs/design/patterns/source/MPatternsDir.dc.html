          saved: on ? 'true' : 'false', saveLabel: (on ? 'Saved: ' : 'Save ') + p.name, heartFill: on ? '#f34646' : 'none', heartStroke: on ? '#f34646' : '#000',
          save: function () { var m = Object.assign({}, s.saved); m[p.n] = !on; self.setState({ saved: m }); } };
      }),
      sheet: s.sheet, openSheet: function () { self.setState({ sheet: true }); }, closeSheet: function () { self.setState({ sheet: false }); },
      showCount: 'Show ' + list.length + (list.length === 1 ? ' pattern' : ' patterns'),
      filterLabel: 'Filters' + (s.lv.length + s.get.length + (s.top ? 1 : 0) ? ' · ' + (s.lv.length + s.get.length + (s.top ? 1 : 0)) : '')
    };
  }
}
</script>
</body>
</html>
